cargo-features = ["codegen-backend"]

[workspace.package]
version = "0.10.0"
edition = "2024"
authors = ["Chssam"]
keywords = ["pxls.space"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Chssam/pixel_maper/tree/main"
rust-version = "1.100"
publish = false

[workspace]
resolver = "2"
members = ["pxls-placemaper"]
default-members = ["pxls-placemaper"]

#   ----------------------------------------------------------------------

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
incremental = false
debug = true

#   ----------------------------------------------------------------------

[workspace.dependencies.image]
version = "0.25"
default-features = false
features = ["png", "gif"]

[workspace.dependencies.serde]
version = "1.0"
features = ["derive"]

[workspace.lints.clippy]
type_complexity = "warn"
deprecated_semver = "deny"

[workspace.dependencies]
hex = "0.4"
glam = "0.34"
bevy_derive = "0.20"

lzma-rust2 = { version = "0.25", default-features = false, features = [
    "std",
    "xz",
] } # Compress file
sha256 = "1.6"

ron = "0.12"
gif = "0.14"
svg = "0.18"

anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
# Optimization
log = { version = "*", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
