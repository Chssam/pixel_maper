# cargo-make
# cargo install --force cargo-make
# Link: https://github.com/sagiegurari/cargo-make

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
default_to_workspace = false


# Debug runner
[tasks.run]
command = "cargo"
args = ["run", "--bin", "pxls-placemaper"]

# Build debug exe
[tasks.build]
command = "cargo"
args = ["build", "--bin", "pxls-placemaper"]

# Release runner
[tasks.release]
command = "cargo"
args = ["run", "--release", "--bin", "pxls-placemaper"]

# Build release exe
[tasks.build_release]
command = "cargo"
args = ["run", "--release", "--bin", "pxls-placemaper"]


# Backup Commands
[tasks.clean_backup]
script = "rmdir /s /q backups"

[tasks.new_backup]
script = "mkdir backups"

[tasks.backup_cargo]
script = "copy Cargo.toml backups\\"

[tasks.backup_pxls]
script = "xcopy pxls backups\\pxls\\ /s /q"

[tasks.backup]
dependencies = ["new_backup", "backup_cargo", "backup_pxls"]
